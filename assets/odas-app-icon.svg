<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hintergrund-Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb8f7"/>
      <stop offset="100%" stop-color="#3d3fa5"/>
    </linearGradient>
    <!-- Schatten-Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGrad)"/>

  <!-- Optional: Glanz-Overlay oben-links -->
  <ellipse cx="160" cy="140" rx="180" ry="160" fill="white" fill-opacity="0.07"/>

  <!-- Motiv: Organigramm -->
  <g filter="url(#shadow)">
    <!-- Root Node -->
    <rect x="206" y="120" width="100" height="60" rx="12" fill="none" stroke="#ffffff" stroke-width="20"/>
    <!-- Level 1 Nodes -->
    <rect x="100" y="240" width="80" height="50" rx="10" fill="#ffffff"/>
    <rect x="216" y="240" width="80" height="50" rx="10" fill="#ffffff"/>
    <rect x="332" y="240" width="80" height="50" rx="10" fill="#ffffff"/>
    <!-- Connections -->
    <path d="M 256 180 L 256 210" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <path d="M 140 210 L 372 210" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <path d="M 140 210 L 140 240" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <path d="M 256 210 L 256 240" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <path d="M 372 210 L 372 240" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <!-- Level 2 Nodes -->
    <rect x="100" y="340" width="80" height="50" rx="10" fill="#ffffff"/>
    <path d="M 140 290 L 140 340" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <rect x="332" y="340" width="80" height="50" rx="10" fill="#ffffff"/>
    <path d="M 372 290 L 372 340" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>